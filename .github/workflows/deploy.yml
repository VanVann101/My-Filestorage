name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Подпись живёт ограниченное время, поэтому пересобираем раз в сутки:
  # иначе страница молча протухнет к моменту, когда она нужнее всего.
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate signed upload policy
        env:
          YC_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          YC_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          YC_BUCKET: ${{ vars.YC_BUCKET }}
          EVENT_ID: ${{ vars.EVENT_ID }}
          EVENT_TITLE: ${{ vars.EVENT_TITLE }}
          POLICY_DAYS: ${{ vars.POLICY_DAYS || '7' }}
          MAX_FILE_MB: ${{ vars.MAX_FILE_MB || '2048' }}
        run: npm run policy

      - name: Build
        env:
          VITE_BASE: ${{ vars.VITE_BASE || '/' }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
